name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      # Regenerate rather than trust the committed copies, so content whose
      # frontmatter changed without the generators being re-run still deploys
      # correctly. All three use the stdlib only — no venv needed.
      #
      # Order matters: gen_game_data rewrites the spell/miracle metadata blocks
      # from frontmatter, and gen_llms_txt reads the finished pages, so the
      # index it writes describes what actually ships.
      - name: Generate view manifest
        run: python3 scripts/gen_view_manifest.py

      - name: Generate game data
        run: python3 scripts/gen_game_data.py

      - name: Generate llms.txt
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/gen_llms_txt.py --base-url "$SITE_URL"

      - name: Build site
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          import yaml

          # Use this fork's URLs without changing the checked-in configuration.
          config = tomllib.loads(Path("zensical.toml").read_text())["project"]
          repo_url = os.environ["REPOSITORY_URL"]
          config["copyright"] = config["copyright"].replace(config["repo_url"], repo_url)
          config["repo_url"] = repo_url
          config["site_url"] = os.environ["SITE_URL"].rstrip("/") + "/"
          Path("zensical.pages.yml").write_text(yaml.safe_dump(config, sort_keys=False))
          PY
          uv run zensical build --config-file zensical.pages.yml

      # Post-build: drop each page's Markdown source next to its rendered
      # HTML, so appending "index.md" to any page URL returns the source.
      - name: Emit raw Markdown pages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 scripts/gen_llms_txt.py --site-dir site --base-url "$SITE_URL"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
          retention-days: 1

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
